# Mantiene despierto el backend del plan Free de Render (se duerme tras ~15 min sin tráfico).
# Provisional para el evento: bórralo al pasar a un plan de pago. GitHub puede retrasar los cron unos minutos.
name: keepalive-render

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://hacknation-xd2k.onrender.com/api/health
